[pytest]
pythonpath = backend
testpaths = backend/src/services
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=src.services --cov-report=term-missing
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
    ignore::Warning:logfire.*
    ignore::Warning:google.*
    ignore::UserWarning:httpx.*
    ignore::UserWarning:starlette.*
    ignore:.*FormattingFailedWarning.*
    ignore:.*slated for removal.*
    ignore:.*is deprecated.*
    ignore:.*app.*shortcut is now deprecated.*
