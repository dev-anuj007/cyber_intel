    <text x="12" y="75" fill="#475569" font-size="9.5">• Prompt v1.0 vs v2.0 Scoring Diff</text>
    <text x="12" y="88" fill="#64748b" font-size="8.5">sales-intel-dev-eval | 4GB Tmp</text>
  </g>

