  <!-- Background Base -->
  <rect width="1200" height="660" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="24" y="20" width="1152" height="48" rx="8" fill="url(#headerGrad)"/>
