  <text x="325" y="49" fill="#38bdf8" font-size="13" font-weight="600">Sales Intelligence Platform — Serverless Microservices Topology</text>
  <rect x="1050" y="32" width="110" height="24" rx="12" fill="#1e3a8a"/>
  <text x="1105" y="48" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle">ap-south-1</text>

  <!-- ==================== TIER 1: CLIENT & INGRESS LAYER ==================== -->
  <rect x="24" y="85" width="1152" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow)"/>
