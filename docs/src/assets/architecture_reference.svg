    <rect x="17" y="17" width="28" height="16" rx="1" fill="#ffffff"/>
    <path d="M 10 40 L 52 40" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="56" y="28" fill="#0f172a" font-size="12" font-weight="700">Web Browser</text>
    <text x="56" y="44" fill="#64748b" font-size="10">Chrome / Firefox</text>
  </g>

  <!-- S3 Static Website Box -->
  <g transform="translate(250, 118)">
