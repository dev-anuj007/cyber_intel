    <rect x="12" y="12" width="34" height="34" rx="6" fill="url(#lambdaGrad)" filter="url(#iconShadow)"/>
    <text x="29" y="34" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">λ</text>
