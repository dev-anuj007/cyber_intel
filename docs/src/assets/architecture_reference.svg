  <text x="40" y="518" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.5">STORAGE &amp; EXTERNAL AI FOUNDATION TIER</text>

  <!-- Amazon S3 Database Bucket Card -->
  <g transform="translate(45, 530)">
    <rect width="530" height="92" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
