    <text x="90" y="55" fill="#15803d" font-size="11" font-weight="600">sales-intel-dev-db-ap-south-1-516869793582 / accounts.db</text>
    <text x="90" y="72" fill="#475569" font-size="10.5">• 1.23 GB SQLite Relational Store | 11 Normalized Tables | 372,467 Business Accounts</text>
    <text x="90" y="86" fill="#64748b" font-size="9.5">• In-Memory &amp; /tmp Ephemeral Fast Streaming Caching across all 8 microservices</text>
  </g>

  <!-- Google Gemini 3.1 Flash Lite Card -->
  <g transform="translate(620, 530)">
    <rect width="530" height="92" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
    <rect x="16" y="16" width="60" height="60" rx="10" fill="url(#geminiGrad)" filter="url(#iconShadow)"/>
    <!-- Gemini Sparkle Icon -->
    <path d="M 46 26 C 46 38, 38 46, 26 46 C 38 46, 46 54, 46 66 C 46 54, 54 46, 66 46 C 54 46, 46 38, 46 26 Z" fill="#ffffff"/>
    <text x="90" y="38" fill="#0f172a" font-size="14" font-weight="700">Google Gemini 3.1 Flash Lite Inference</text>
    <text x="90" y="55" fill="#6d28d9" font-size="11" font-weight="600">Model: gemini-3.1-flash-lite (Enterprise BYOK &amp; Platform Keys)</text>
    <text x="90" y="72" fill="#475569" font-size="10.5">• 4-Tier Forensic Calibration (1–100) &amp; Executive Outreach Pitch Synthesis</text>
    <text x="90" y="86" fill="#64748b" font-size="9.5">• Grounded in CISA KEV Exploitation Catalogs, CVE Records, and Tech Fingerprints</text>
  </g>

  <!-- Connectors from Microservices to Storage / AI -->
  <path d="M 457 460 L 457 524" fill="none" stroke="#7AA116" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 1017 460 L 1017 524" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
