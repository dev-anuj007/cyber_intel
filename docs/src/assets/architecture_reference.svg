    <!-- S3 Icon -->
    <rect x="14" y="12" width="38" height="38" rx="8" fill="url(#s3Grad)" filter="url(#iconShadow)"/>
    <path d="M 23 23 L 33 18 L 43 23 L 33 28 Z M 23 27 L 33 32 L 43 27 M 23 33 L 33 38 L 43 33" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="28" fill="#0f172a" font-size="12" font-weight="700">Amazon S3 Static Website</text>
    <text x="60" y="43" fill="#15803d" font-size="10" font-weight="600">React 18 SPA + MkDocs Site</text>
    <text x="60" y="56" fill="#64748b" font-size="9.5">sales-intel-dev-frontend</text>
  </g>

  <!-- Amazon API Gateway Box -->
  <g transform="translate(560, 118)">
