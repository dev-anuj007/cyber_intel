  <!-- API GW to Lambdas Routing Line -->
  <path d="M 855 180 L 855 245" fill="none" stroke="#E7157B" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- ==================== TIER 3: DATA STORAGE & AI INFERENCE LAYER ==================== -->
