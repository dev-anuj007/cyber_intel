site_name: Sales Intelligence Platform
site_description: AI-Native B2B Cybersecurity Prospecting & Attack Surface Intelligence
site_author: Cybersecurity Sales Engineering Team
docs_dir: src
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2

nav:
  - System Overview & Guide: index.md
  - Strategic Planning & ICP: planning.md
  - System Architecture & Polyglot Storage: architecture.md
  - Agentic Dev Loop & How We Build: how-you-build.md
  - Technical Design Document (DDD): technical-design-doc.md
